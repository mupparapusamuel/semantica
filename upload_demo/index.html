<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Semantica Upload Demo</title>
  <style>body{font-family:Segoe UI,Arial;max-width:900px;margin:24px} .file-card{border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:6px}.preview img{max-width:220px;display:block}</style>
</head>
<body>
  <div class="header">
    <h1>Semantica — Premium Upload</h1>
    <p class="subtitle">Upload any file (text, PDF, DOCX, images). Semantica extracts semantics and generates visual insights and graphs.</p>
  </div>

  <div class="upload-panel">
    <label class="dropzone" id="dropzone">Drop files here or <input id="files" type="file" multiple /></label>
    <div class="actions"><button id="uploadBtn" disabled>Upload Selected</button><div id="notice" class="notice"></div></div>
  </div>

  <div id="results" class="results-grid"></div>

  <!-- Global graph mode controls -->
  <div id="graph-controls" style="margin:12px 0;display:flex;gap:8px;align-items:center;">
    <label style="font-weight:600;">Graph Mode:</label>
    <select id="graph-mode-select">
      <option value="structural">Structural</option>
      <option value="heatmap">Heatmap</option>
      <option value="ego">Ego</option>
      <option value="semantic">Semantic</option>
      <option value="temporal">Temporal</option>
    </select>
    <label id="anchor-label" style="margin-left:8px;display:none">Anchor:</label>
    <select id="anchor-select" style="display:none"></select>
    <button id="apply-mode" style="margin-left:6px;">Apply</button>
    <span id="mode-help" style="margin-left:12px;color:#444;font-size:13px">Choose a mode and press Apply to update visible graphs.</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="static/visualize.js"></script>
  <script>
  // Premium styling interactions
const input = document.getElementById('files');
const notice = document.getElementById('notice');
const results = document.getElementById('results');
  const uploadBtn = document.getElementById('uploadBtn');
  const dropzone = document.getElementById('dropzone');
  let selectedFiles = [];

  function setFiles(files){
    selectedFiles = files;
    uploadBtn.disabled = !files || files.length===0;
  }

  dropzone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', (e)=>{ dropzone.classList.remove('drag'); });
  dropzone.addEventListener('drop', (e)=>{ e.preventDefault(); dropzone.classList.remove('drag'); const dt = e.dataTransfer; if(dt && dt.files) { input.files = dt.files; setFiles(Array.from(dt.files)); }});
  uploadBtn.addEventListener('click', ()=>{ input.dispatchEvent(new Event('change')); });

function topWords(text, n=10){
  const words = text.toLowerCase().match(/[a-z0-9]+/g) || [];
  const counts = {};
  for(const w of words){counts[w]= (counts[w]||0)+1}
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>({word:x[0],count:x[1]}));
}

// Local fallback processor for when server returns unsupported format or empty parse
async function localProcessFile(file, card, canvas, graphDiv, semanticsPre){
  const preview = card.querySelector('.preview');
  if(file.type && file.type.startsWith('text/') || /\.(txt|md|json|csv|xml)$/i.test(file.name)){
    const text = await file.text();
    preview.textContent = text.slice(0,2000);
    const top = topWords(text,12);
    const words = (text||'').toLowerCase().match(/[a-z0-9]+/g)||[];
    const counts = {}; for(const w of words){ if(!['the','and','is','in','it','to','of','a'].includes(w)) counts[w]=(counts[w]||0)+1 }
    const topWords = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
    const nodes = topWords.map(w=>({id:w,label:w,size:Math.max(5,counts[w]||1)}));
    const edges = [];
    for(let i=0;i<words.length;i++){ const w=words[i]; if(!topWords.includes(w)) continue; for(let j=i+1;j<Math.min(words.length,i+4);j++){ const v=words[j]; if(topWords.includes(v)&&v!==w){ edges.push({source:w,target:v,weight:1}); }}}
    semanticsPre.textContent = JSON.stringify({name:file.name,size:file.size,type:file.type,topWords:top,graph:{nodes,edges}},null,2);
    try{ renderBarChart(canvas, top.map(x=>({word:x.word||x[0],count:x.count||x[1]}))); }catch(e){}
    try{ graphDiv._nodes = nodes; graphDiv._edges = edges; renderGraph(graphDiv, nodes, edges); }catch(e){}
  } else if(file.type && file.type.startsWith('image/')){
    const data = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
    const img = document.createElement('img'); img.src = data; preview.appendChild(img);
    semanticsPre.textContent = JSON.stringify({name:file.name,size:file.size,type:file.type,preview:'image data URL'},null,2);
  } else {
    const ab = await file.arrayBuffer();
    const bytes = new Uint8Array(ab).slice(0,256);
    const hex = Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join(' ');
    preview.textContent = hex;
    semanticsPre.textContent = JSON.stringify({name:file.name,size:file.size,type:file.type,hexPreview:hex.split(' ').slice(0,48).join(' ')},null,2);
  }
}

input.addEventListener('change', async (e)=>{
  results.innerHTML='';
  const files = Array.from(e.target.files || []);
  if(files.length===0) return;
  if(files.length>5){ notice.textContent='Please select at most 5 files.'; return; } else { notice.textContent=''; }
  setFiles(files);

  // Try server-side processing first; fallback to local processing on network error.
  try {
    const form = new FormData();
    for(const f of files) form.append('files', f, f.name);
    const resp = await fetch('/upload', { method: 'POST', body: form });
    if(!resp.ok) throw new Error('Server returned ' + resp.status);
    const data = await resp.json();
    // show server-provided results
    for(const r of data.results || []){
      const card = document.createElement('div'); card.className='file-card';
      const header = document.createElement('div'); header.className='card-header'; header.innerHTML=`<strong>${r.filename}</strong>`;
      card.appendChild(header);

      // Preview
      const preview = document.createElement('div'); preview.className='preview'; preview.textContent = r.preview || '';
      card.appendChild(preview);

      // Visualizations container
      const viz = document.createElement('div'); viz.className='viz';
      const canvas = document.createElement('canvas'); canvas.style.maxWidth='100%'; viz.appendChild(canvas);
      const graphDiv = document.createElement('div'); graphDiv.className='graph'; viz.appendChild(graphDiv);
      card.appendChild(viz);

      // Render top words chart
      try{ renderBarChart(canvas, r.top_words || []); } catch(e){ console.warn(e); }
      // Render graph with D3
      try{ 
        const nodes = (r.graph && r.graph.nodes) || [];
        const edges = (r.graph && r.graph.edges) || [];
        if(nodes.length && edges.length){ graphDiv._nodes = nodes; graphDiv._edges = edges; renderGraph(graphDiv, nodes, edges); }
        else {
          // server returned no usable graph — try local fallback using selectedFiles
          const local = (selectedFiles || []).find(f=>f.name === r.filename);
          if(local){ const semanticsPre = document.createElement('pre'); semanticsPre.style.whiteSpace='pre-wrap'; card.appendChild(semanticsPre); await localProcessFile(local, card, canvas, graphDiv, semanticsPre); }
        }
      } catch(e){ console.warn(e); }

      // Raw parsed JSON download
      const semanticsPre = document.createElement('pre'); semanticsPre.style.whiteSpace='pre-wrap'; semanticsPre.textContent = JSON.stringify(r.parsed, null, 2);
      const downloadBtn = document.createElement('button'); downloadBtn.textContent='Download semantics (JSON)';
      downloadBtn.style.marginTop='8px';
      downloadBtn.addEventListener('click', ()=>{ const blob = new Blob([semanticsPre.textContent],{type:'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download = r.filename + '.semantics.json'; a.click(); URL.revokeObjectURL(url); });
      card.appendChild(semanticsPre);
      card.appendChild(downloadBtn);
      results.appendChild(card);
    }
      // populate anchors for global mode controls
      try{ populateAnchors(); }catch(e){}
      return;
  } catch (err) {
    console.warn('Server processing failed, falling back to local:', err);
    notice.textContent = 'Server unreachable — using client-side processing.';
  }

  // Local processing fallback
    for(const file of files){
    const card = document.createElement('div'); card.className='file-card';
    const title = document.createElement('div'); title.innerHTML=`<strong>${file.name}</strong> — ${Math.round(file.size/1024)} KB`;
    card.appendChild(title);

    const meta = document.createElement('div'); meta.textContent = `Type: ${file.type || 'unknown'}`;
    card.appendChild(meta);

    const preview = document.createElement('div'); preview.className='preview'; card.appendChild(preview);

    const semanticsPre = document.createElement('pre'); semanticsPre.style.whiteSpace='pre-wrap';

    // handle text
    if(file.type && file.type.startsWith('text/') || /\.(txt|md|json|csv|xml)$/i.test(file.name)){
      const text = await file.text();
      preview.textContent = text.slice(0,2000);
      const top = topWords(text,10);
      // Create a small graph client-side to mimic server
      const graph = (function(){
        const words = (text||'').toLowerCase().match(/[a-z0-9]+/g)||[];
        const counts = {};
        for(const w of words){ if(!['the','and','is','in','it','to','of','a'].includes(w)) counts[w]=(counts[w]||0)+1 }
        const topWords = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
        const nodes = topWords.map(w=>({id:w,label:w,size:Math.max(5,counts[w]||1)}));
        const edges = [];
        for(let i=0;i<words.length;i++){
          const w=words[i]; if(!topWords.includes(w)) continue;
          for(let j=i+1;j<Math.min(words.length,i+4);j++){ const v=words[j]; if(topWords.includes(v)&&v!==w){ edges.push({source:w,target:v,weight:1}); }}
        }
        return {nodes,edges};
      })();

      semanticsPre.textContent = JSON.stringify({name:file.name,size:file.size,type:file.type,topWords:top,graph:graph},null,2);
      // render visuals
      const viz = document.createElement('div'); viz.className='viz';
      const canvas = document.createElement('canvas'); viz.appendChild(canvas);
      const graphDiv = document.createElement('div'); graphDiv.className='graph'; viz.appendChild(graphDiv);
      card.appendChild(viz);
      try{ renderBarChart(canvas, top.map(x=>({word:x.word||x[0],count:x.count||x[1]}))); }catch(e){}
      try{ graphDiv._nodes = graph.nodes; graphDiv._edges = graph.edges; renderGraph(graphDiv, graphDiv._nodes, graphDiv._edges); }catch(e){}
    } else if(file.type && file.type.startsWith('image/')){
      const data = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
      const img = document.createElement('img'); img.src = data; preview.appendChild(img);
      semanticsPre.textContent = JSON.stringify({name:file.name,size:file.size,type:file.type,preview:'image data URL'},null,2);
    } else {
      // binary fallback: show first bytes hex
      const ab = await file.arrayBuffer();
      const bytes = new Uint8Array(ab).slice(0,256);
      const hex = Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join(' ');
      preview.textContent = hex;
      semanticsPre.textContent = JSON.stringify({name:file.name,size:file.size,type:file.type,hexPreview:hex.split(' ').slice(0,48).join(' ')},null,2);
    }

    const downloadBtn = document.createElement('button'); downloadBtn.textContent='Download semantics (JSON)';
    downloadBtn.style.marginTop='8px';
    downloadBtn.addEventListener('click', ()=>{
      const blob = new Blob([semanticsPre.textContent],{type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download = file.name + '.semantics.json'; a.click(); URL.revokeObjectURL(url);
    });

    card.appendChild(semanticsPre);
    card.appendChild(downloadBtn);
    results.appendChild(card);
  }
  try{ populateAnchors(); }catch(e){}
});

// Graph mode control wiring
const modeSelect = document.getElementById('graph-mode-select');
const anchorSelect = document.getElementById('anchor-select');
const anchorLabel = document.getElementById('anchor-label');
const applyBtn = document.getElementById('apply-mode');

function populateAnchors(){
  const graphs = document.querySelectorAll('.graph');
  const ids = new Set();
  graphs.forEach(g=>{ const nodes = g._nodes||[]; nodes.forEach(n=>ids.add(n.id)); });
  anchorSelect.innerHTML = '';
  ids.forEach(id=>{ const o = document.createElement('option'); o.value = id; o.textContent = id; anchorSelect.appendChild(o); });
  anchorLabel.style.display = ids.size ? 'inline-block' : 'none';
  anchorSelect.style.display = ids.size ? 'inline-block' : 'none';
}

modeSelect.addEventListener('change', ()=>{
  if(modeSelect.value==='ego'){
    populateAnchors();
  } else {
    anchorLabel.style.display='none'; anchorSelect.style.display='none';
  }
});

applyBtn.addEventListener('click', ()=>{
  const mode = modeSelect.value;
  const anchor = (mode==='ego' && anchorSelect.value) ? anchorSelect.value : null;
  document.querySelectorAll('.graph').forEach(g=>{ try{ renderGraph(g, g._nodes||[], g._edges||[], mode, anchor); }catch(e){ console.warn(e); } });
});
  </script>

  <style>
  body{font-family:Segoe UI,Arial;background:#f6f8fb;color:#111;margin:0;padding:28px}
  .header{background:linear-gradient(90deg,#2b2b8f,#6f4bd8);color:white;padding:24px;border-radius:10px}
  .header h1{margin:0;font-weight:600}
  .subtitle{opacity:0.9}
  .upload-panel{display:flex;align-items:center;gap:12px;margin-top:18px}
  .dropzone{display:block;padding:18px;border:2px dashed rgba(0,0,0,0.08);border-radius:8px;background:white;cursor:pointer}
  .dropzone input{display:inline-block}
  .actions{display:flex;flex-direction:column;gap:8px}
  button{background:#5b4fe6;color:white;border:none;padding:10px 14px;border-radius:6px;cursor:pointer}
  .notice{color:#a33}
  .results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px;margin-top:18px}
  .file-card{background:white;border-radius:10px;padding:16px;box-shadow:0 6px 18px rgba(19,24,36,0.06)}
  .preview{white-space:pre-wrap;max-height:160px;overflow:auto;background:#fafafa;padding:8px;border-radius:6px;margin-top:8px}
  .viz{display:flex;gap:8px;align-items:flex-start;margin-top:12px}
  .viz canvas{width:240px;height:160px}
  .graph{width:100%;height:200px}
  pre{background:#0f1724;color:#e6eef8;padding:12px;border-radius:6px;overflow:auto}
  </style>
</body>
</html>
